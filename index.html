<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Para Minha Bebezinha ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Georgia, serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        180deg,
        #030817 0%,
        #122f75 30%,
        #4f4d97 65%,
        #ff9bbd 100%
    );
}

/* ESTRELAS */

.stars{
    position:fixed;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

/* COMETA */

.comet{
    position:fixed;
    width:220px;
    height:3px;
    background:white;
    top:15%;
    left:-300px;
    box-shadow:0 0 20px white;
    transform:rotate(-25deg);
    animation:cometMove 12s linear infinite;
}

@keyframes cometMove{
    0%{
        left:-300px;
        top:15%;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        left:130%;
        top:55%;
        opacity:0;
    }
}

/* FIO VERMELHO */

.red-thread{
    position:fixed;
    width:150%;
    height:5px;
    background:#ff2b5f;
    left:-25%;
    top:50%;
    box-shadow:0 0 25px #ff2b5f;
    transform:rotate(-8deg);
    animation:threadMove 7s ease-in-out infinite;
}

@keyframes threadMove{

    0%{
        transform:rotate(-8deg) translateY(0);
    }

    50%{
        transform:rotate(-5deg) translateY(-12px);
    }

    100%{
        transform:rotate(-8deg) translateY(0);
    }
}

/* CORAÇÕES */

.heart{
    position:fixed;
    color:#ff406f;
    opacity:.45;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-150px);
    }
}

/* ENVELOPE */

#envelope{
    width:300px;
    height:210px;
    background:white;
    position:relative;
    cursor:pointer;
    z-index:10;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    transition:.4s;
}

#envelope:hover{
    transform:scale(1.05);
}

#envelope::before{
    content:'';
    position:absolute;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:105px solid #ececec;
}

#envelope-text{
    position:absolute;
    width:100%;
    text-align:center;
    top:135px;
    font-size:24px;
    color:#d3003f;
    font-weight:bold;
}

/* CARTA */

#letter{
    display:none;
    width:min(92%,900px);
    background:rgba(255,255,255,.97);
    border-radius:25px;
    padding:40px;
    box-shadow:0 15px 60px rgba(0,0,0,.4);
    z-index:20;
    max-height:88vh;
    overflow:auto;
}

#letter h1{
    text-align:center;
    color:#ff315c;
    font-size:38px;
    margin-bottom:25px;
    text-shadow:0 0 15px rgba(255,49,92,.4);
}

#message{
    white-space:pre-line;
    font-size:18px;
    line-height:1.9;
    color:#333;
}

#acceptBtn{
    display:none;
    margin:35px auto 0;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ff315c;
    color:white;
    font-size:20px;
    cursor:pointer;
}

#finalMessage{
    display:none;
    text-align:center;
    margin-top:25px;
    color:#ff315c;
    font-size:26px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="comet"></div>

<div class="red-thread"></div>

<div id="envelope">
    <div id="envelope-text">
        Para Minha Bebezinha ❤️
    </div>
</div>

<div id="letter">

    <h1>❤️ Para Minha Bebezinha ❤️</h1>

    <div id="message"></div>

    <button id="acceptBtn">
        ❤️ Sim ❤️
    </button>

    <div id="finalMessage">
        Então vamos assistir Your Name juntos. ❤️<br><br>
        Eu te amo, Eri.
    </div>

</div>

<audio id="bgmusic" loop>
    <source src="you_are_the_right_one.mp3" type="audio/mpeg">
</audio>

<script>

/* ESTRELAS */

for(let i=0;i<180;i++){

    const star=document.createElement("div");

    star.classList.add("star");

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*3+"s";

    document.querySelector(".stars").appendChild(star);
}

/* CORAÇÕES */

for(let i=0;i<25;i++){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"%";

    heart.style.fontSize=(18+Math.random()*24)+"px";

    heart.style.animationDuration=(8+Math.random()*10)+"s";

    document.body.appendChild(heart);
}

const text = `

Momo,

sei que está sendo difícil ultimamente. Não consigo mensurar o quão difícil é para você lidar com tudo isso. Venho tentando melhorar e espero que essas mudanças consigam te alcançar.

Hoje venho aqui com um gesto muito valioso e espero que ainda haja um espacinho no seu coraçãozinho para isso.

Nunca vou deixar de me esforçar para alcançarmos novos patamares. Eu sempre vou te amar, independente de tudo, Eri. Você sabe disso, né!?

Estou muito receoso se você realmente vai gostar do anel. Eu pensei muito sobre qual escolher e acabei chegando neste.

Eu sabia que esse não seria o nosso anel definitivo, pois eu queria algo maior para isso, mas, ao mesmo tempo, não queria algo pequeno.

Ao invés de pequenos detalhes como a cor ou a forma, eu encontrei esse par com um valor simbólico maior por trás das linhas vermelhas.

Nunca assisti ao filme Your Name, mas gostaria muito de ver com você, e já vi sobre as histórias delas.

(Akai Ito)

Com isso, eu preciso te perguntar:

Você aceita, Eri?

Ver este pequeno gesto e esse filme comigo?

E claro...

Você aceita namorar comigo, princesa?

Ainda irei pedir pessoalmente e quantas vezes forem necessárias, mas espero que, em todas elas, haja um espacinho no seu coraçãozinho para eu aflorar todo o meu amor.

`;

document.getElementById("envelope").onclick=()=>{

const music = document.getElementById("bgmusic");

if(music){

    music.volume = 1.0;

    music.muted = false;

    music.play().then(() => {

        console.log("Música iniciada");

    }).catch(error => {

        console.error("Erro ao tocar:", error);

    });
}

    document.getElementById("envelope").style.display="none";

    document.getElementById("letter").style.display="block";

    let i=0;

    function type(){

        if(i<text.length){

            document.getElementById("message").innerHTML += text.charAt(i);

            i++;

            setTimeout(type,22);

        }else{

            document.getElementById("acceptBtn").style.display="block";
        }
    }

    type();
};

document.getElementById("acceptBtn").onclick=()=>{

    document.getElementById("finalMessage").style.display="block";

    for(let i=0;i<30;i++){

        const heart=document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML="❤";

        heart.style.left=Math.random()*100+"%";

        heart.style.fontSize=(25+Math.random()*30)+"px";

        heart.style.animationDuration=(4+Math.random()*4)+"s";

        document.body.appendChild(heart);
    }
};

</script>

</body>
</html>
